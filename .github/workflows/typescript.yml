name: TypeScript build and replay compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Reject checked-in JavaScript and generated bundles
        run: |
          if git ls-files | grep -Ei '\.(js|mjs|cjs|jsx)(\.map)?$'; then
            echo 'Keep authored source in TypeScript and build outputs out of Git.'
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck:all
      - run: npm test
      - run: node build/scripts/check.mjs
      - run: npm run verify:parity
