<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOBA · LOOMEN</title>
<link rel="stylesheet" href="moba.css?v=5.1.0"><link rel="stylesheet" href="pit-v5-tokens.css?v=6.0.2"><link rel="stylesheet" href="pit-v6-moba.css?v=6.0.2">
</head>
<body class="v6-moba">
<main class="shell">
  <header class="mast">
    <a class="brand" href="index.html" aria-label="LOOMEN home"><span aria-hidden="true">◈</span><b>LOOMEN <small>VERSION 6.0.1</small></b></a>
    <nav aria-label="Game modes"><a href="index.html">Arena</a><a href="moba.html" aria-current="page">MOBA</a><a href="tournament.html">Tournament</a><a href="idle-rpg.html">Idle RPG</a></nav>
  </header>
  <section class="intro" aria-labelledby="fronts-title">
    <div><h1 id="fronts-title">MOBA</h1></div>
    <div class="tags"><span>5v5</span><span>Solo + AI</span></div>
  </section>
  <section class="battle" aria-label="Battlefield">
    <div class="score">
      <div class="team blue"><b>Blue</b><span id="blueStatus">Core Intact</span></div>
      <div class="time"><span class="tally"><b id="blueKills" class="kills blue" aria-label="Blue knockouts"></b><b id="clock">00:00</b><b id="redKills" class="kills red" aria-label="Pink knockouts"></b></span><span id="wave">Ready</span><span id="bellStatus" hidden></span></div>
      <div class="team red"><b>Pink</b><span id="redStatus">Core Intact</span></div>
    </div>
    <div class="viewport">
      <canvas id="field" width="1280" height="720" tabindex="0" aria-label="Battlefield"></canvas>
      <div class="overlay" id="brief">
        <h2>Pick a Lane</h2>
        <div class="form-pick"><label for="saberForm">Form</label><select id="saberForm" aria-describedby="formHint"></select><p id="formHint" hidden></p></div>
        <label class="bell-toggle"><input id="bellRally" type="checkbox" aria-describedby="bellHelp"><span>Bell Rally</span></label><p class="bell-help" id="bellHelp" hidden>Hold center ring to reinforce mid wave</p>
        <div class="deploy" aria-label="Pick a lane"><button type="button" data-lane="0">North</button><button type="button" data-lane="1">Center</button><button type="button" data-lane="2">South</button></div>
      </div>
      <div class="overlay" id="finished" hidden>
        <h2 id="result"></h2><p id="resultInfo"></p>
        <button type="button" id="restart">Play Again</button>
      </div>
    </div>
    <div class="field-tools"><div><div id="vitals" aria-label="Fighter status"><b id="heroForm">Ready</b><span>HP <b id="heroHP">—</b></span><span>STA <b id="heroEnergy">—</b></span><span>Lv <b id="heroLevel">—</b></span><span>K/D <b id="heroRecord">—</b></span></div><small class="key-hints"><span class="v6-meta">WASD Move</span> <span class="v6-meta">M Map</span> <span class="v6-meta">Esc Pause</span></small></div><button type="button" id="map" hidden>Follow</button><button type="button" id="upgrade" hidden>Upgrade</button><button type="button" id="pause" hidden>Pause</button><button type="button" id="leave" hidden>Leave</button></div>
  </section>
  <section class="controls" aria-label="Battle controls">
    <div class="move" aria-label="Movement">
      <button type="button" data-control="up" aria-label="Move up"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 14l4-4 4 4" transform="rotate(0 12 12)"/></svg></button>
      <button type="button" data-control="left" aria-label="Move left"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 14l4-4 4 4" transform="rotate(-90 12 12)"/></svg></button>
      <button type="button" data-control="down" aria-label="Move down"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 14l4-4 4 4" transform="rotate(180 12 12)"/></svg></button>
      <button type="button" data-control="right" aria-label="Move right"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 14l4-4 4 4" transform="rotate(90 12 12)"/></svg></button>
    </div>
    <div class="attacks">
      <button type="button" data-control="attack" aria-label="Slash (J)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 19C9 9 14 5 20 4"/><path d="M3.5 15.5c2 1.2 3.8 2.6 5 4.5"/><path d="M14 9.5l1.6 1.6"/></svg><span class="lbl">Slash</span><kbd>J</kbd></button>
      <button type="button" data-control="lunge" aria-label="Lunge (K)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12h14"/><path d="M13 7l5 5-5 5"/><path d="M3 8.5v7"/></svg><span class="lbl">Lunge</span><kbd>K</kbd></button>
      <button type="button" data-control="guard" aria-label="Guard (Space)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3l7 3v5.5c0 4.2-2.9 7.6-7 9.5-4.1-1.9-7-5.3-7-9.5V6z"/><path d="M12 7.5v9"/></svg><span class="lbl">Guard</span><kbd>Space</kbd></button>
    </div>
  </section>
  <footer><p><span class="v6-meta"><b>Move</b> WASD</span> <span class="v6-meta"><b>Aim</b> Click</span> <span class="v6-meta"><b>Map</b> M</span> <span class="v6-meta"><b>Upgrade</b> U</span></p></footer>
  <p id="announce" class="sr" aria-live="polite"></p>
</main>
<script type="module" src="arcade-moba-ui.js?v=6.0.2"></script>
</body>
</html>
